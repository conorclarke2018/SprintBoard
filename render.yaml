services:
  - type: web
    name: sprintboard
    runtime: python
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install uv && uv sync --frozen --no-dev
    startCommand: cd backend && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: SECRET_KEY
        generateValue: true
